name: Build check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run production build
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
      - name: Publish build failure details
        if: steps.build.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## HRaniti production build failure"
            echo ""
            echo "Commit: ${{ github.sha }}"
            echo ""
            echo '~~~text'
            tail -n 160 build.log
            echo '~~~'
          } > build-debug.md
          gh issue create --title "[build-debug] ${{ github.sha }}" --body-file build-debug.md
      - name: Fail build after publishing diagnostics
        if: steps.build.outcome == 'failure'
        run: exit 1
